# 업무 용어집.
#
# 두 종류를 담습니다.
#   1. terms       — 정의가 필요한 업무 용어 ("활성 고객"이 정확히 뭔가)
#   2. not_covered — 이 DB에 **없는** 정보 (환각 방지용)
#
# 2번이 특히 효과적입니다. 프로젝트 1에서 "직원 연봉" 질문에 LLM이
# 없는 컬럼을 지어냈던 것을 기억하세요. 여기 적어두면 검색 단계에서 잡힙니다.
#
# TODO: 아래 예시를 채우고 늘려가세요.

version: 1

terms:

  - term: 활성 고객
    synonyms: [액티브 고객, 유효 고객]
    definition: 최근 12개월 이내에 1건 이상 구매한 고객
    sql_hint: |
      EXISTS (
        SELECT 1 FROM analytics_marts.fct_sales s
        WHERE s.customer_id = c.customer_id
          AND s.invoice_date >= (SELECT MAX(invoice_date) FROM analytics_marts.fct_sales) - INTERVAL '12 months'
      )
    note: |
      Chinook 데이터는 2009~2013년으로 고정돼 있습니다. CURRENT_DATE 기준으로
      계산하면 활성 고객이 0명이 됩니다. 반드시 데이터의 최대 날짜를 기준으로 하세요.

